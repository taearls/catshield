[package]
name = "cat_shield"
version = "0.1.0"
edition = "2021"
description = "A cat-proof screen overlay that keeps your machine awake and blocks input"
authors = ["Tyler Earls"]
license = "MIT"
repository = "https://github.com/taearls/catshield"
keywords = ["macos", "utility", "screen-lock", "input-blocking"]
categories = ["command-line-utilities"]

# Cross-platform dependencies
[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
toml = "0.9"
serde = { version = "1.0", features = ["derive"] }

# macOS-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSBezierPath", "NSButton", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSPanel", "NSScreen", "NSSlider", "NSStatusBar", "NSStatusItem", "NSStringDrawing", "NSTableColumn", "NSTableView", "NSText", "NSTextField", "NSView", "NSWindow", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", features = ["CFMachPort", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes", "CGRemoteOperation"] }
dispatch2 = "0.3"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

# Linux-specific dependencies (to be implemented)
[target.'cfg(target_os = "linux")'.dependencies]
# x11rb, dbus, etc. will be added when Linux support is implemented

[dev-dependencies]
tempfile = "3.10"
serial_test = "3.2"

[profile.release]
opt-level = 3
lto = true
