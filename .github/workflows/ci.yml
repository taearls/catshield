name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint and format checks run once (not platform-specific)
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Build on macOS and Windows using native runners
  # Uses nick-fields/retry for transient infrastructure failures (Issue #184)
  build-native:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Run Clippy
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 10
          command: cargo clippy --all-targets -- -D warnings
      - name: Build release
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 10
          command: cargo build --release --locked

  # Build on Linux using Docker (docker/linux/Dockerfile as source of truth)
  build-linux:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t catshield-linux -f docker/linux/Dockerfile .
      - name: Run Clippy
        run: docker run --rm -v "${{ github.workspace }}:/app" catshield-linux cargo clippy --all-targets -- -D warnings
      - name: Build release
        run: docker run --rm -v "${{ github.workspace }}:/app" catshield-linux cargo build --release --locked

  # Test on macOS and Windows using native runners
  # Uses nick-fields/retry for transient infrastructure failures (Issue #184)
  test-native:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Run tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 10
          command: cargo test --verbose --locked

  # Test on Linux using Docker (docker/linux/Dockerfile as source of truth)
  test-linux:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t catshield-linux -f docker/linux/Dockerfile .
      - name: Run tests
        run: docker run --rm -v "${{ github.workspace }}:/app" catshield-linux cargo test --verbose --locked
